# Models, clip lengths and prices for pipeline/generate.py, kept in one place because the providers keep
# renaming and retiring models. Prices are USD, checked on the official pages on 9 Nov 2026; check again
# before a large batch. generate.py estimates every call from these figures before spending anything.

batch: batch-05               # tag written to the spend ledger with every paid call
run_budget_usd: 15            # one command may not plan to spend more than this
batch_budget_usd: 30          # batch 5 and the page 1 Kling remakes (docs/archive/final-plan.md); all calls tagged with `batch` may not spend more than this in total
ledger: media/generate-ledger.jsonl   # every paid call, with its estimated and actual cost (iCloud-backed, not in git)

# Keys live in .env (git-ignored), one per line: GEMINI_API_KEY=... (or GOOGLE_AI_API_KEY), KLING_API_KEY=... (or
# KLING_AI_API_KEY), OPENAI_API_KEY=..., DASHSCOPE_API_KEY=... and DASHSCOPE_WORKSPACE=... (the Model Studio workspace ID)
gemini:
  base: https://generativelanguage.googleapis.com/v1beta
  api_revision: "2026-05-20"
  key_env: [GEMINI_API_KEY, GOOGLE_API_KEY, GOOGLE_AI_API_KEY]   # first one set wins

kling:
  base: https://api-singapore.klingai.com
  key_env: [KLING_API_KEY, KLING_AI_API_KEY]

openai:
  base: https://api.openai.com/v1
  key_env: [OPENAI_API_KEY]

# Alibaba Cloud Model Studio (DashScope), Singapore region: the key and the model must be in the same region.
# The general Singapore address works with the key alone (checked 11 Nov 2026); the workspace address
# (https://{workspace}.ap-southeast-1.maas.aliyuncs.com/api/v1) refused the ID in .env as "Workspace endpoint is invalid".
dashscope:
  base: https://dashscope-intl.aliyuncs.com/api/v1
  key_env: [DASHSCOPE_API_KEY]
  workspace_env: [DASHSCOPE_WORKSPACE, DASHSCOPE_WORKSPACE_ID]

# Stills: Gemini 3 Pro Image ("Nano Banana Pro") through the Interactions API.
# $0.134 per image at 1K or 2K (aistudio.google.com/docs/pricing); 4K is $0.24.
image:
  model: gemini-3-pro-image
  aspect_ratio: "16:9"
  size: 2K
  usd_per_image: 0.134
  candidates: 4

# Stills on Kling instead (`still --engine kling`): Kling Image 3.0, 8 units per 1K or 2K image, sold in separate
# image packs (kling.ai/dev/pricing, Image API): $0.0035 per unit list = $0.028 per image; the first General trial
# pack is $2.45 for 1,000 units ($0.00245). Kling Image 4.0 is not on the API (Nov 2026).
kling_image:
  endpoint: /v1/images/generations
  model: kling-v3
  resolution: 2k
  aspect_ratio: "16:9"
  units_per_image: 8
  usd_per_unit: 0.0035
  concurrency: 9                # images in flight per pack (each image of an n-image task counts)

# Stills on GPT Image instead (`still --engine openai`, files o1.jpg, ...; `edit` of an o*.jpg uses it too), through
# OpenAI's Image API (/v1/images/generations and /v1/images/edits). Billed by tokens
# (developers.openai.com/api/docs/pricing, 10 Nov 2026, the same for 2.5 and 2.6, flare and sunburst): image output
# $30, image input $8 and text input $5 per million. OpenAI publishes no per-image figure for 2.5 or 2.6, so
# usd_per_image is only the estimate before a call; the actual cost comes
# from the token usage the API returns. Custom sizes (multiples of 16, 1:3 to 3:1) are documented for gpt-image-2 and
# the 2.5 models only; for any other model generate.py asks for `fallback_size` and centre-crops to 16:9.
openai_image:
  model: gpt-image-2.5-flare      # Kayvan's choice (10 Nov): native 16:9 at a large size; 2.6 only makes standard sizes
  custom_sizes: [gpt-image-2, gpt-image-2.5-flare, gpt-image-2.5-sunburst]   # models documented to accept any WxH
  size: 2560x1440                 # 16:9, the largest non-experimental size (Kayvan, 10 Nov)
  fallback_size: 1536x1024        # standard size for models without custom sizes, cropped to 1536x864
  quality: high
  output_format: jpeg
  output_compression: 95
  usd_per_image: 0.06             # estimate before the call; measured 10 Nov at high: 2.5-flare 2560x1440 $0.056
                                  # (1,842 output tokens), 1536x864 $0.033; 2.6-flare 1536x1024 $0.041
  usd_per_million: {text_input: 5.0, image_input: 8.0, image_output: 30.0}

# Video, keyed by the `model` field of a window in scenes/scenes.yaml.
video:
  # Veo 3.1 was shut down on the Gemini API on 22 Oct 2026 (it survives only in Flow until 5 Dec 2026 and on
  # Google's enterprise platform). Google's successor on the Gemini API is Gemini Omni 1.2 Flash:
  # $12 per million video output tokens, 8,688 tokens per second at 1080p (upsampled) = about $0.104/s.
  # Audio is generated by default and not billed separately. The still guides the video but is not
  # guaranteed to be the exact first frame; `end_on_still` also sends it as the last frame (3 to 10 s only).
  Veo:
    engine: gemini
    model: gemini-omni-1.2-flash
    resolution: 1080p
    aspect_ratio: "16:9"
    seconds: 10
    usd_per_second: 0.104          # estimate before the call
    usd_per_million_output: 12.0   # actual cost after the call, from the token usage returned
    usd_per_million_input: 1.5
    end_on_still: false
    prompt_prefix: Use this image as the exact first frame of the video.
  # Kling 4.0 on Kling's own API (kling.ai/dev/pricing): 1.5 units per second at 1080p with no input video,
  # prepaid only. Flagship trial pack: $9 for 64 units = $0.1413 per unit (first purchase, 30 days); the 180-day
  # packs start at $500. App credits cannot be used. Kling 4.0 Flash is 720p only. Native audio is included.
  Kling:
    engine: kling
    endpoint: /omni-video/kling-4.0
    resolution: 1080p
    aspect_ratio: "16:9"
    seconds: 10
    units_per_second: 1.5
    usd_per_unit: 0.1413
    audio: native
    end_on_still: false
    prompt_prefix: "@image_1 is the first frame of the video."
  # Wan 3.0 on Alibaba Cloud Model Studio (preview, Nov 2026): first-frame image to video, 2 to 30 s, 30 fps,
  # results kept 24 hours (generate.py downloads at once). $0.20 per second at 1080P; sound does not change the
  # price. Not tied to a `model` in scenes.yaml: use `video NN --engine wan` (or --engine kling,wan for both).
  Wan:
    engine: wan
    model: wan3.0-video
    resolution: 1080P
    ratio: "16:9"
    seconds: 10
    audio: true
    watermark: false
    prompt_extend: false          # Model Studio rewrites prompts by default; ours already follow the house rules
    usd_per_second: 0.20
    end_on_still: false           # first frame only (Wan 3.0 also offers first and last frame; not wired up)
    prompt_prefix: Image 1 is the exact first frame of the video.
