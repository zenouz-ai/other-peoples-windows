# Single source of truth for every window: what exists, how it was made, and what is planned.
# Status: done | batch-05 (the final six, docs/batch-05.md) | cut (not in the film: the project finishes at 30
# windows, decided 13 Nov 2026; their prompts are kept for reference).
# loop_settings are the exact make_loop.py arguments used, so any loop can be rebuilt from media/raw.
# Planned windows store prompt parts only (scene, motion, ambience, empty); pipeline/prompts.py joins them
# with prompt_style into the full prompts, checks them (`lint`) and writes the batch briefs (`brief`).
project: Other People's Windows
target_windows: 30   # windows in the film (status not `cut`); the scene IDs run to 50 and stay fixed

# Every clip is generated long enough to give a 6 to 10 second continuous loop after make_loop.py trims
# about half a second from the start: Veo 8 s (its maximum), Kling 8 to 10 s.
clip_seconds: {veo: 8, kling: [8, 10]}
loop_seconds: [6, 10]

# Shared wording, after Google's Veo 3.1 and Gemini image guidance (Nov 2026): shot and subject first, then
# light and style; describe what should be there rather than what should not; label the sound
# ("Ambient noise:"). Rules from docs/log.md: one slow continuous motion, nobody enters, leaves or looks at
# the camera, no readable text or logos, sound faint and never music.
prompt_style:
  image: >-
    Generate a 16:9 image. {scene} Photorealistic, shot on 35mm film with a 35mm lens, deep focus and fine
    grain. London at dusk in late autumn: cool blue light outside, warm light inside, faint reflections of
    the street on the glass. Candid and quiet. {people} Every sign, screen, label and book spine is blank or
    too small to read, and nothing carries a brand logo.
  people: >-
    Any people are small in the frame, absorbed in what they are doing, seen side-on or from behind with
    their faces turned away from the camera. Keep the people exactly as described.
  empty_room: Nobody is in the room.
  video: >-
    Static locked-off shot from a tripod, one continuous take: the framing stays exactly as in the image,
    with no zoom, push-in, pan or camera drift. Animate this exact image, keeping the same place, people and
    lighting. {motion} All motion is slow, subtle and continuous for the whole clip, {stay}. Ambient noise:
    {ambience}, very faint and muffled, as if heard from outside through closed glass. No music, no singing,
    no dialogue.
  stay_people: and everyone stays in place with their faces turned away from the camera
  stay_empty: and the room stays empty

batches:
  batch-02:
    title: "Batch 2: eight new windows on app credits"
    summary: Eight window types the facade does not have yet, made by hand with the credits already paid for. Then the API pipeline takes over.
    purpose: >-
      Use the Google Flow and Kling app credits on scenes that add variety: a shop at work, an empty seasonal
      room, a dark high-rise, rain, a craft at work, a group of friends and an older neighbour with a pet.
      Each model gets the scenes it handles best.
    key_points:
      - "**Deadline:** Google says Veo 3.1 Fast and Quality retire on 5 December 2026. Make windows 07 to 10 first."
      - "**Veo 3.1 Quality in Flow (07 to 10, 100 credits each, 8 seconds):** atmosphere-led scenes where light, water or fire carry the motion."
      - "**Kling 4.0 (11 to 14, 8 to 10 seconds):** scenes with hands and people, where Kling beat Veo in the café and dog tests. Check the credit cost shown before generating; use 1080p."
      - "**Both:** 16:9, the still as the start frame only, one take each. Every clip must give a 6 to 10 second loop."
      - "**Sound:** faint ambience only. Kling''s sound has added music, speech and farmyard noises in tests, so every clip goes through `pipeline/sound_check.py`; a flagged clip keeps its picture and is muted or regenerated."
      - "**Still images:** Gemini 3.1 Pro with the image prompts below. Check that the people match the casting before animating."
      - "**Name the files** with the window ID (for example `07-launderette.mp4`) and save them into `media/inbox/`."
    next_actions:
      - Make the 8 stills in Gemini and save them to `media/stills/`
      - Generate the 4 Veo clips in Flow (Quality, 8 s) before 5 December 2026
      - Generate the 4 Kling clips (8 to 10 s)
      - Save the clips to `media/inbox/` and ask Claude Code to check, loop and add them to page 2
    models:
      Veo: Veo 3.1 Quality, 8 s (Flow)
      Kling: Kling 4.0, 8 to 10 s
  batch-04:
    title: "Batch 4: the model shoot-out (page 4)"
    summary: Six windows for page 4, each still made by Gemini, GPT Image and Midjourney and each picked still animated twice, by Wan 3.0 and by the current model, so the tools for the last 26 windows are chosen on a written scorecard.
    midjourney: true
    purpose: >-
      Two empty, atmosphere-led rooms (28, 46: today Omni's ground) and four people scenes with hands and
      bodies (22, 27, 34, 49: today Kling's ground; 49, an evening church service, came in on 11 Nov), mixing street level and high-rise. Same prompts for every model,
      same checks, results in docs/batch-04-scorecard.md (written by `generate.py review`). Plan and costs:
      docs/archive/plan-batches-04-05.md.
    key_points:
      - "**Stills:** four candidates per window from each of Gemini (`generate.py still NN`), GPT Image (`--engine openai`) and Midjourney (by hand, prompt below; two grids per window)."
      - "**Midjourney:** paste the Midjourney prompt into midjourney.com, download the best four images of two grids into `media/inbox/`, then `generate.py import NN FILES` copies them to `media/stills/NN/m1.jpg` onwards."
      - "**Score before picking:** casting as described, faces away, no extra people or pedestrians, no readable text or logos, London at dusk and the 35 mm look, edits needed."
      - "**Video:** each picked still gets a Wan 3.0 take and a take on the current model (Kling 4.0 for 22, 27, 34, 49; Gemini Omni for 28, 46): `generate.py video NN --engine wan,kling` or `wan,omni`."
      - "**Midjourney video (by hand, third contender):** in midjourney.com, upload the picked still as the starting frame, paste the Midjourney video prompt, HD, low motion, then extend once to 9 s (clips start at 5 s and extend in 4 s steps). It has no sound, so the window gets a sound bed. `generate.py import NN FILE.mp4` copies the download to `media/inbox/` as an `_mj` take and checks it."
      - "**Checks:** `generate.py check` and `review`: first frame against the still, wobble, drift, sound flags; casting held and hands by eye."
      - "**Budget:** $40 for the batch on the APIs (`generate.yaml`), plus one month of Midjourney."
    next_actions:
      - Make the Gemini and GPT Image stills (dry run first, then with Kayvan's go-ahead)
      - Make two Midjourney grids per window and import the picks
      - Score the stills in the scorecard and pick one per window
      - Make the Wan 3.0 and current-model takes, score them, loop the better one and place it on page 4
    models:
      Veo: "Gemini Omni 1.2 Flash, 10 s, against Wan 3.0 (empty rooms)"
      Kling: "Kling 4.0, 10 s, against Wan 3.0 (people)"
  batch-05:
    title: "Batch 5: the final six (page 5)"
    summary: The last six windows, made with the tools that won batch 4, to finish the facade at 30 windows on five pages.
    midjourney: true
    purpose: >-
      Fill the gaps in the facade: a teenager (19), a whole family round a board game (20), a father and small child
      (32), the most London of shopfronts (36), a view down into a basement (15) and one empty, aqua room (16). Mostly street
      level and upstairs terraces, since page 4 already has two high-rise windows. Plan and costs:
      docs/archive/plan-batches-04-05.md.
    key_points:
      - "**Stills:** four GPT Image 2.5-flare candidates at 2560x1440 (`generate.py still NN --engine openai`) and two Midjourney grids per window (`prompts.py show NN --midjourney`, then `generate.py import`). Upscale a Midjourney pick (Subtle) before using it. Gemini only for edits or a hard window."
      - "**Score before picking:** casting as described, faces away, no extra people or pedestrians, no readable text or logos, London at dusk and the 35 mm look, sharp at full size."
      - "**Video:** Kling 4.0, 10 s at 1080p, for the five people scenes (15, 19, 20, 32, 36); Wan 3.0 for the pool (16), with Gemini Omni as the fallback. Check every Wan take frame by frame."
      - "**Sound:** expect to replace Kling's sound with a bed from a rejected take or another raw clip; nothing with music or words."
      - "**Budget:** $25 on the APIs (`generate.yaml`). Kling has 151 units (10 takes of 10 s), enough for batch 5 and the page 1 retakes."
    next_actions:
      - Check the OpenAI and Alibaba Cloud balances (Kling topped up 13 Nov)
      - Make the GPT Image stills and the Midjourney grids; score and pick
      - Make the six takes; loop the keepers with sound beds; place them on page 5
      - Render the five-page film in 4K and update YouTube and zenouz.ai
    models:
      Kling: Kling 4.0, 10 s at 1080p (Kling API)
      Wan: Wan 3.0, 10 s at 1080p (Alibaba Cloud Model Studio), Gemini Omni as the fallback
  backlog:
    title: "Backlog: windows 15 to 50"
    summary: The remaining 36 windows, for the API pipeline (roadmap, Phase 4). Replaces the production pack PDF, whose numbering and prompts are out of date.
    purpose: >-
      Every scene adds something the facade does not yet have. The model column follows the 8 November test:
      Kling for people and hands, Veo (or Google's successor model) for atmosphere-led scenes.
    key_points:
      - "**Clip length:** Veo 8 s; Kling 8 to 10 s, so each loop is 6 to 10 seconds."
      - "**Veo after 5 December 2026:** Google says Veo 3.1 retires then; use the newest Google model that takes a start image. The prompts still apply."
      - "**Sound:** faint ambience only; every clip goes through `pipeline/sound_check.py` before it is looped."
      - "**Window 45** is the countryside pub, set in a village on London's rural edge so the facade stays London."
    next_actions:
      - Create a Gemini API key with billing and a budget alert; optionally a Kling API trial
      - Ask Claude Code to build `pipeline/generate.py` (roadmap, Phase 4) and pilot five scenes
    models:
      Veo: "Gemini Omni 1.2 Flash, 10 s (Gemini API; Veo 3.1 left the API on 22 Oct 2026); empty, atmosphere-led rooms only, since it recast a person on 45"
      Kling: Kling 4.0, 8 to 10 s (Kling API)

