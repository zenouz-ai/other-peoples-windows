pages:
  # Dusk: shops closing, people coming home: chip-shop, cafe, cat, basement, florist, dog
  - {large: chip-shop, right1: cafe, right2: cat, low3: basement, low2: florist, low1: dog}
  # Supper: dinner, pizza, corner-shop, highrise, ironing, tailor
  - {large: dinner, right1: pizza, right2: corner-shop, low3: highrise, low2: ironing, low1: tailor}
  # The evening: village-pub, launderette, potter, knitting, stretch, barber
  - {large: village-pub, right1: launderette, right2: potter, low3: knitting, low2: stretch, low1: barber}
  # Later: board-game, service, gamer, reader, boutique, fish-tank
  - {large: board-game, right1: service, right2: gamer, low3: reader, low2: boutique, low1: fish-tank}
  # Night: pool, terrace, xmas-tree, dinner-party, bedtime, nursery
  - {large: pool, right1: terrace, right2: xmas-tree, low3: dinner-party, low2: bedtime, low1: nursery}
