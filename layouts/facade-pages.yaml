# Running order (13 Nov): dusk to bedtime, the same five pages as layouts/facade-landscape.yaml. The tour visits
# top_wide, left_small, middle_wide, bottom_small, inset_lower, inset_upper, so the film ends on the nursery.
pages:
  # 1 Dusk, shops closing and people coming home
  - {top_wide: chip-shop, left_small: cat, middle_wide: cafe, bottom_small: basement, inset_lower: dog, inset_upper: florist}
  # 2 Supper
  - {top_wide: dinner, left_small: corner-shop, middle_wide: pizza, bottom_small: highrise, inset_lower: tailor, inset_upper: ironing}
  # 3 The evening
  - {top_wide: village-pub, left_small: potter, middle_wide: barber, bottom_small: knitting, inset_lower: launderette, inset_upper: stretch}
  # 4 Later
  - {top_wide: board-game, left_small: gamer, middle_wide: service, bottom_small: fish-tank, inset_lower: boutique, inset_upper: reader}
  # 5 Night, ending on the nursery
  - {top_wide: pool, left_small: xmas-tree, middle_wide: dinner-party, bottom_small: terrace, inset_lower: bedtime, inset_upper: nursery}
