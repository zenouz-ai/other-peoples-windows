# Test of the scrolling camera: the same six windows spread over about 1.4 screens.
# As more windows arrive, extend this facade downwards; the camera scrolls to each window in tour order.
canvas: {width: 2160, gap: 12, background: "#0b0e13"}
output: {width: 2160, height: 3840}
timing: {intro_hold: 4, zoom_in: 1.3, hold: 4, zoom_out: 1.3, gap: 0.5, end_hold: 2, scroll_seconds_per_screen: 3}
windows:
  - {id: dinner,   file: media/loops/05-dinner-through-house.mp4, rect: [12, 12, 2136, 1263],    focus: [0.47, 0.42, 0.50]}
  - {id: cat,      file: media/loops/02-cat-15th-floor.mp4,       rect: [12, 1287, 1300, 1100],  focus: [0.66, 0.60, 0.80]}
  - {id: highrise, file: media/loops/06-highrise-dad-cooking.mp4, rect: [1324, 1287, 824, 1100], focus: [0.50, 0.60, 0.95]}
  - {id: cafe,     file: media/loops/03-cafe.mp4,                 rect: [12, 2399, 2136, 1500],  focus: [0.60, 0.52, 0.52]}
  - {id: terrace,  file: media/loops/01-terrace-couple.mp4,       rect: [12, 3911, 1062, 1400],  focus: [0.62, 0.50, 0.95], gain: 0.35}
  - {id: dog,      file: media/loops/04-dog-fetch.mp4,            rect: [1086, 3911, 1062, 1400], focus: [0.50, 0.62, 0.95]}

tour: [dinner, highrise, cafe, terrace, dog, cat]
