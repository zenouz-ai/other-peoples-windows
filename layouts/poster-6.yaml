# The six-window poster as published (YouTube Short, Nov 2026): one 9:16 screen, two overlapping windows.
# rect: [x, y, width, height] in canvas pixels. layer 1 windows sit on top with a frame and shadow.
# focus: [x fraction, y fraction, camera width as a fraction of the window width] for the close-up.
canvas: {width: 2160, gap: 12, background: "#0b0e13"}
output: {width: 2160, height: 3840}
timing: {intro_hold: 10, zoom_in: 1.3, hold: 5, zoom_out: 1.3, gap: 0.8, end_hold: 3, scroll_seconds_per_screen: 3}
windows:
  - {id: dinner,   file: media/loops/05-dinner-through-house.mp4, rect: [12, 12, 2136, 1263],    focus: [0.47, 0.42, 0.50]}
  - {id: cat,      file: media/loops/02-cat-15th-floor.mp4,       rect: [12, 1287, 1062, 627],   focus: [0.66, 0.62, 0.52]}
  - {id: cafe,     file: media/loops/03-cafe.mp4,                 rect: [12, 1926, 2136, 1263],  focus: [0.60, 0.52, 0.52]}
  - {id: highrise, file: media/loops/06-highrise-dad-cooking.mp4, rect: [12, 3201, 1062, 627],   focus: [0.42, 0.60, 0.62]}
  - {id: terrace,  file: media/loops/01-terrace-couple.mp4,       rect: [848, 1183, 1300, 731],  focus: [0.62, 0.55, 0.72], layer: 1, gain: 0.35}
  - {id: dog,      file: media/loops/04-dog-fetch.mp4,            rect: [788, 3063, 1360, 765],  focus: [0.50, 0.64, 0.54], layer: 1}
tour: [dinner, cat, cafe, highrise, dog, terrace]
